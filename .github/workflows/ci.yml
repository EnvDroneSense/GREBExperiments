name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Check formatting
        run: |
          import Pkg; Pkg.add(name="JuliaFormatter", version="2")
          using JuliaFormatter
          ok = all(format(d; overwrite=false) for d in ("src", "test", "scripts", "docs"))
          ok || error("Not formatted: run JuliaFormatter.format on src, test, scripts and docs")
        shell: julia --color=yes {0}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    env:
      # The tests need no dataset; this keeps a stray call from downloading one.
      DATADEPS_DISABLE_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
